        if (元素) 元素.innerHTML = "选中牌后这里实时结算";
        return;
      }
      let 出的牌 = [];
      for (let i = 0; i < 选中编号们.length; i++) 出的牌.push(手牌[选中编号们[i]]);
      let 牌型 = 识别牌型(出的牌);
      let 结 = 结算战力(出的牌, 牌型);
      let 升 = 牌型等级[牌型];
      let 明细 = "";
      for (let i = 0; i < (结.有效明细 || []).length; i++) {
        明细 += (i > 0 ? " + " : "") + 结.有效明细[i];
      }
      let 兵力加 = "", 士气加 = "", 乘 = "";
      for (let i = 0; i < (结.武将明细 || []).length; i++) {
        let 项 = 结.武将明细[i];
        if (项.段 === "兵力") 兵力加 += " + " + 项.文本;
        if (项.段 === "士气") 士气加 += " + " + 项.文本;
        if (项.段 === "乘") 乘 += " × " + 项.文本;
      }
      预览文字 = '<b>' + 牌型 + '</b>' + (升 && 升.等级 > 0 ? ' 等级' + 升.等级 : '')
           + '<div class="说明">兵力 ' + 结.基础兵力 + ' + (' + 明细 + ')' + 兵力加 + ' = ' + 结.兵力
           + '，士气 ' + 结.士气基础 + 士气加 + (乘 ? "，再" + 乘 : "") + ' = ' + 结.士气
           + '，战力 ' + 结.战力 + '</div>';
      let 元素 = document.getElementById("牌型预览");
      if (元素) 元素.innerHTML = 预览文字;
    }

    // —— 功勋 / 存档 / 整备大厅 ——

    function 刷新价() {
      if (将领.技能 === "仁德" && 本店刷新次数 === 0) return 0;   // 仁德：每店首次刷新免费
      let 价 = Math.max(1, 本局刷新费 - (本局优惠券们["令"] ? 1 : 0));   // 军令如山：刷新费 -1
      return 价 + (将领.技能 === "魏王" ? 2 : 0);   // 曹操·魏王的代价：每次刷新 +2（卡槽多，但翻找更贵）
    }

    function 政令空白率() {   // 董卓·相国专权：诏书泛滥，空白率翻倍（25% → 50%）
      return 将领.技能 === "相国专权" ? Math.min(1, 政令空白基础率 * 2) : 政令空白基础率;
    }

    function 政令价(基价) {   // 政令的实际售价：市集折扣 → 相国专权再加价（诏书泛滥，每张都更贵）
      return 售价(基价) + (将领.技能 === "相国专权" ? 政令加价 : 0);
    }

    function 政令基础额度() {
      if (将领.技能 === "挟天子") return 2;   // 曹操·谯郡起兵（挟天子）：每城两张诏书
      if (将领.技能 === "相国专权") return 2;   // 董卓·相国专权：每城两张诏书（但贵且多为空文）
      return 1;
    }

    function 本关出牌上限() {
      let 羁绊加 = 0;   // 江东都督等工具型羁绊：每关出牌 +1（不进士气公式，不参与乘算）
      let 激活 = 获取激活羁绊();
      for (let i = 0; i < 激活.length; i++) if (激活[i].效果.出牌加) 羁绊加 += 激活[i].效果.出牌加;
      let 形态减 = (将领.技能 === "河北霸主" && 当前关 === 2) ? 1 : 0;   // 袁绍·河北霸主的代价：城主关出牌 -1（兵多而号令不一）
      return 本局出牌上限 + (本局优惠券们["援"] ? 1 : 0) + 羁绊加 - (当前关 === 2 ? 1 : 0) - 形态减;   // 增援令 +1，城主 Boss 关 -1
    }

    function 本关弃牌上限() {
      return 每局弃牌次数 + (本局优惠券们["弃"] ? 1 : 0) + (将领.技能 === "江东猛虎" ? 1 : 0);   // 骠骑营 +1；孙坚·江东猛虎 +1
    }

    function 招募价(基础价) {   // 董卓·西凉铁骑：招募武将 -1（最低 1 粮草）
      let 价 = 售价(基础价);
      if (将领.技能 === "西凉铁骑") 价 = Math.max(1, 价 - 1);
      return 价;
    }

    function 锦囊容量() {
      return 2 + (本局优惠券们["栏"] ? 1 : 0);   // 铁匠铺：锦囊栏 +1 格
    }

    function 售价(原价) {
      if (!本局优惠券们["折"]) return 原价;      // 市集：商店所有商品打 8 折（向上取整，最低 1）
      return Math.max(1, Math.ceil(原价 * 0.8));
    }

    function 羁绊提示文本(名) {   // 悬停羁绊标签时显示组成：谁 + 效果（分档羁绊列出全档）
      for (let i = 0; i < 羁绊表.length; i++) {
        if (羁绊表[i].名 !== 名) continue;
        let 羁 = 羁绊表[i];
        if (羁.成员) return 羁.名 + "：" + 羁.成员.join(" + ") + " · " + 羁.说明;
        let 文 = 羁.名 + "（" + 羁.阵营 + "将，按已招募人数分档）：";
        for (let j = 0; j < 羁.分档.length; j++) 文 += "\n" + 羁.分档[j].需要 + " 人档 · " + 羁.分档[j].说明;
        return 文;
      }
      return 名;
    }

      document.getElementById("设置遮罩").style.display = "block";
    }

    function 速度档位钮(档) {
      return '<button class="档位钮 ' + (设置.演出速度 === 档 ? "选中" : "") + '" onclick="设演出速度(\'' + 档 + '\')">' + 档 + '</button>';

    function 设演出速度(档) { 设置.演出速度 = 档; 应用设置(); 写存档(); 开设置(); }
    function 请求重置() { 重置确认中 = true; 开设置(); }
    function 取消重置() { 重置确认中 = false; 开设置(); }

    function 重置存档() {
      localStorage.removeItem("zhuolu-存档");
      功勋 = 0; 已买升级们 = {}; 已选将领 = "刘备"; 已选形态 = "织席贩履";

      新手礼包已领 = false;
      重置确认中 = false;

    function 关设置() {
      if (设置来自菜单) { 设置来自菜单 = false; 显示主菜单(); return; }

    // —— 统计 ——

    function 解锁进度() {   // 返回 { 武将已, 武将共, 形态已, 形态共, 诸侯已, 诸侯共 }
      let 武将已 = 0, 武将共 = 0;
      for (let i = 0; i < 武将池.length; i++) {
        武将共++;
        if (!武将池[i].解锁功勋 || 已买升级们[武将池[i].名字]) 武将已++;
      }
      let 形态已 = 0, 形态共 = 0, 诸侯已 = 0;
      for (let i = 0; i < 将领池.length; i++) {
        let 诸侯解锁 = 将领池[i].解锁功勋 === 0 || 已买升级们["将领·" + 将领池[i].名字];
        if (诸侯解锁) 诸侯已++;
        for (let j = 0; j < 将领池[i].形态.length; j++) {
          形态共++;
          // 形态计数前提：这位诸侯本身已解锁——没解锁诸侯时，他家的"免费形态"也用不上，不算已解锁（v0.32.2 修：此前会显示 5/10）
          if (诸侯解锁 && 形态已解锁(将领池[i].名字, 将领池[i].形态[j].名, 将领池[i].形态[j].解锁功勋)) 形态已++;
        }
      }
      return { 武将已: 武将已, 武将共: 武将共, 形态已: 形态已, 形态共: 形态共, 诸侯已: 诸侯已, 诸侯共: 将领池.length };
    }

    function 开统计() {
      隐藏所有遮罩();   // 从主菜单/战场任何入口打开前先清场，防止旧界面叠在新界面上（v0.32.2 修）
      let 进 = 解锁进度();
      let 文字 = '<div class="菜单标题" style="font-size:22px;letter-spacing:5px;">统 计</div>'
           + '<div class="统计行"><span>累计出征</span><span class="统计数">' + 总战绩.局数 + ' 局</span></div>'
           + '<div class="统计行"><span>一统江山</span><span class="统计数">' + 总战绩.一统次数 + ' 次</span></div>'
           + '<div class="统计行"><span>历史最远抵达</span><span class="统计数">' + (总战绩.最远城 > 0 ? "第 " + 总战绩.最远城 + " 城" : "尚未出征") + '</span></div>'
           + '<div class="统计行"><span>最高单次战力</span><span class="统计数">' + 总战绩.最高战力 + '</span></div>'
           + '<div class="统计行"><span>累计攻下城池</span><span class="统计数">' + 总战绩.累计破城 + ' 座</span></div>'
           + '<div class="统计行"><span>当前功勋</span><span class="统计数">' + 功勋 + '</span></div>'
           + '<div style="margin-top:14px;text-align:left;font-weight:bold;">解锁进度</div>'
           + '<div class="统计行"><span>武将入池</span><span class="统计数">' + 进.武将已 + ' / ' + 进.武将共 + '</span></div>'
           + '<div class="统计行"><span>诸侯出战</span><span class="统计数">' + 进.诸侯已 + ' / ' + 进.诸侯共 + '</span></div>'
           + '<div class="统计行"><span>将领形态</span><span class="统计数">' + 进.形态已 + ' / ' + 进.形态共 + '</span></div>'
           + '<div class="说明" style="text-align:left;margin-top:12px;">功勋只解锁内容（武将入池 / 诸侯出战 / 将领形态），不买数值——这是本作防数值膨胀的第三条铁律。</div>'
           + '<div style="margin-top:16px;"><button onclick="关统计()">返回</button></div>';
      document.getElementById("统计区").innerHTML = 文字;
      document.getElementById("统计遮罩").style.display = "block";
    }

    function 关统计() {
      if (统计来自菜单) { 统计来自菜单 = false; 显示主菜单(); return; }
      隐藏所有遮罩();
    }

    // —— 第 33 步：新手教程（v0.34.1 重做：状态驱动「到什么界面讲什么」）——
    // 做法仍是对标小丑牌 Tutorial（真对局里学），但不再按固定顺序推进——
    // 军师每时每刻看玩家在哪：进了商店讲商店、到了城主关讲词条、遇到路遇讲路遇。
    // 每讲只出现一次（讲过就不再打扰），玩家不弃牌也绝不卡住后面的课。
    let 教程中 = false;
    let 教程已讲 = {};        // 已出现过的讲（键 → true），每讲只弹一次
    let 教程做过 = {};        // 玩家做过的动作（如弃牌——做过就不再弹弃牌讲）
    let 教程店数 = 0;         // 本次教学局进店次数（第 1 次讲总览、第 2 次讲三类卡详解）

    // 每一讲的文案：键 = 状态场景
    let 教程讲义 = {
      开局: "欢迎来到<b>三国逐鹿</b>！你是诸侯，靠打牌攻城：一共 <b>8 座城</b>，每城 <b>3 关</b>（先锋→守将→城主），每关把手牌凑成牌型打出，<b>战力达到目标</b>就过关。先认界面：<b>顶部面板</b>是家底（粮草=钱、出牌/弃牌=本关剩余次数）；<b>左上信息栏</b>实时预览选中的牌型；底部<b>「牌型表」</b>随时可查 10 种牌型数值。",

      出牌后: "这就是<b>出牌</b>：<b>兵力 × 士气 = 战力</b>。注意看战场——招募的武将会按<b>布阵顺序</b>依次出手加成（先加兵力、再加士气、最后乘率），「<b>布阵·触发顺序</b>」按钮可调整谁站哪个位置，影响很大。",

    };

    function 教程当前键() {   // 看玩家现在在哪，返回该讲的键（null = 暂时没课）
      if (破全城) return "一统";
      if (游戏结束) return "败北";
      if (当前事件) return "路遇";
      if (商店开着) return 教程店数 <= 1 ? "商店" : "商店2";
      if (当前关 === 2 && !破城) return "城主";
      if (累计战力 === 0 && 选中编号们.length === 0 && 教程做过["出牌"] !== true) return "开局";
      if (选中编号们.length > 0 && 累计战力 === 0) return "选牌";
      if (累计战力 > 0 && !教程做过["弃牌"] && 弃牌次数 > 0 && 本局出牌上限 > 0) return "弃牌";
      if (累计战力 > 0) return "工具";
      return null;
    }

    function 教程文本() {
      let 键 = 教程当前键() || "工具";
      return '<span class="教程步">军师</span> ' + 教程讲义[键]
           + ' <button class="档位钮" style="margin-left:8px;" onclick="教程知道了()">知道了 ▸</button>';
    }

    function 教程动作(键) {   // 各操作点的钩子：记录玩家做过什么，并刷新军师提示
      if (!教程中) return;
      教程做过[键] = true;
      刷新教程条();
    }

    function 教程知道了() {   // 玩家点「知道了」：先收起，等进入下一个新场景再弹下一讲
      if (!教程中) return;
      let 条 = document.getElementById("教程条");
      if (条) 条.style.display = "none";
      if (typeof document !== "undefined" && document.body) document.body.classList.remove("教程在");
    }

    function 刷新教程条() {
      let 条 = document.getElementById("教程条");
      if (!条) return;
      if (!教程中) {
        条.style.display = "none";
        if (typeof document !== "undefined" && document.body) document.body.classList.remove("教程在");
        return;
      }
      let 键 = 教程当前键();
      if (!键 || 教程已讲[键]) {   // 没新课时收起条，不打扰
        条.style.display = "none";
        if (typeof document !== "undefined" && document.body) document.body.classList.remove("教程在");
        return;
      }
      教程已讲[键] = true;
      条.style.display = "flex";
      if (typeof document !== "undefined" && document.body) document.body.classList.add("教程在");
      let 头 = document.getElementById("教程头像");
      if (头 && !头.innerHTML) 头.innerHTML = 立绘HTML("军师", 36);   // 军师像素头像
      let 文 = document.getElementById("教程文");
      if (文) 文.innerHTML = 教程文本();
    }

    function 开教程() {   // 从主菜单进：真对局 + 军师随场景讲解（到什么界面讲什么）
      隐藏所有遮罩();
      教程中 = true;
      教程已讲 = {};
      教程做过 = {};
      教程店数 = 0;
      重新开始();
      提示("新手教程：军师会跟着你走到哪讲到哪（每讲只出现一次，随时可点「跳过教程」）");
      刷新教程条();

      教程中 = false;
      刷新教程条();
      提示("已跳过教程——祝你逐鹿中原。主菜单里的「新手教程」随时可以再进。");
    }

    function 结算() {
      游戏结束 = true;
      本局进行中 = false;   // 本局结束：主菜单不再显示「继续本局」
      let 破城奖励 = 已破城数 * 破城功勋;
      let 战力奖励 = 0, 达档们 = [];   // 分档制：最高单次战力按档位阶梯累进（打得越猛拿得越多，无硬顶）
      for (let i = 0; i < 功勋战力档位.length; i++) {
        if (最高战力 >= 功勋战力档位[i]) { 战力奖励 += 功勋战力档奖[i]; 达档们.push(功勋战力档位[i]); }
      }
      let 全城奖励 = 破全城 ? 一统功勋 : 0;
      let 本局功勋 = 破城奖励 + 战力奖励 + 全城奖励;
      功勋 += 本局功勋;
      // —— 统计（第 33 步）：本局战果累加进存档，统计界面靠它出数 ——
      总战绩.局数 += 1;
      总战绩.最远城 = Math.max(总战绩.最远城, 当前城 + 1);
      总战绩.最高战力 = Math.max(总战绩.最高战力, 最高战力);
      总战绩.累计破城 += 已破城数;
      if (破全城) 总战绩.一统次数 += 1;
      写存档();
      let 结果 = 破全城 ? "一统江山！八城尽归麾下" : ("止步于第 " + (当前城 + 1) + " 城「" + 城池表[当前城].名 + "」第 " + (当前关 + 1) + " 关「" + 关名们[当前关] + "」");
      显示结算(结果, 破城奖励, 战力奖励, 全城奖励, 本局功勋, 达档们);
    }

    function 显示结算(结果, 破城奖励, 战力奖励, 全城奖励, 本局功勋, 达档们) {
      let 档文字 = 达档们.length > 0 ? "（达成战力档 " + 达档们.join(" / ") + "）" : "（未达最低战力档 " + 功勋战力档位[0] + "）";
      let 文字 = '<div class="商店"><b>逐鹿结果</b>'

           + '<div>累计功勋 <b>' + 功勋 + '</b></div>'
           + '<div style="margin-top: 12px;"><button onclick="隐藏所有遮罩(); 显示大厅()">前往整备大厅</button></div></div>';
      document.getElementById("结算区").innerHTML = 文字;
      document.getElementById("结算遮罩").style.display = "block";
    }

      // 首局保底（第 33 步）：一次都没解锁过、功勋又不到 10 时，首次进大厅免费送一名体验型武将，保证新手第一局就有获得感

           + 礼包提示;
      // —— 出战将领（第 31 步起：将领 × 形态；第 33 步起：形态二还要战绩解锁）——
      文字 += '<div style="margin-top: 12px; font-weight: bold;">出战将领 · 形态</div>'

      for (let i = 0; i < 将领池.length; i++) {

        for (let j = 0; j < 将.形态.length; j++) {
          let 形 = 将.形态[j];
          let 已解锁 = 形态已解锁(将.名字, 形.名, 形.解锁功勋);
          let 在阵 = (已选将领 === 将.名字 && 已选形态 === 形.名);
          let 战绩够 = 战绩达标(形);
          文字 += '<div style="margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border: 1px solid #eee; border-radius: 6px; padding: 6px; ' + (在阵 ? "border-color:#c9a227; background:#fdf6e3;" : "") + '">'
               + '<div style="flex: 1; min-width: 200px;"><b>「' + 形.名 + '」</b>' + (形.战绩 ? ' <span class="说明" style="color:#8a5a00;">进阶</span>' : '') + ' · ' + 形.说明 + '</div>'
               + (!将领已解锁 ? '<span class="说明">先解锁诸侯</span>'
                  : !已解锁 ? '<button onclick="解锁形态(\'' + 将.名字 + '\',\'' + 形.名 + '\')" ' + (战绩够 ? '' : 'style="background:#aaa;"') + '>解锁形态（' + 形.解锁功勋 + ' 功勋' + 战绩文字(形) + '）</button>'
                            : '<button onclick="选择形态(\'' + 将.名字 + '\',\'' + 形.名 + '\')" ' + (在阵 ? "disabled" : "") + '>' + (在阵 ? "✓ 出战中" : "选为出战") + '</button>')
               + '</div>';
        }
        文字 += '</div>';
      }
      // —— 武将解锁 ——
      文字 += '<div style="margin-top: 12px; font-weight: bold;">武将入池解锁</div>'
           + '<div style="font-size: 12px; color: #777; margin-top: 4px;">标「新手价」的几位解锁线压得很低，两局内就能拿到，先拿来做手感实验。</div>';
      let 有可解锁 = false;
      for (let i = 0; i < 武将池.length; i++) {
        let 武 = 武将池[i];
        if (!武.解锁功勋) continue;
        有可解锁 = true;
        let 已买 = 已买升级们[武.名字];
        文字 += '<div style="margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border: 1px solid #ddd; border-radius: 8px; padding: 8px;">'
             + '<div style="flex: 1; min-width: 180px;"><b>' + 武.名字 + '</b> · ' + 武.稀有度 + (武.解锁功勋 <= 15 ? ' <span class="说明" style="color:#8a5a00;">新手价</span>' : '') + ' · ' + 武.说明 + '</div>'
             + '<button onclick="买升级(\'' + 武.名字 + '\')" ' + (已买 ? "disabled" : "") + '>'
             + (已买 ? "已解锁" : "解锁（" + 武.解锁功勋 + " 功勋）") + '</button></div>';
      }
      if (!有可解锁) 文字 += '<div class="说明">（暂无待解锁武将）</div>';
      文字 += '<div style="margin-top: 14px;"><button onclick="开始逐鹿()">开始逐鹿</button>'
           + '<button class="档位钮" onclick="显示主菜单()">返回主菜单</button></div></div>';
      document.getElementById("大厅区").innerHTML = 文字;
      document.getElementById("大厅遮罩").style.display = "block";
    }

    function 解锁将领(名字) {
      let 将 = null;
      for (let i = 0; i < 将领池.length; i++) if (将领池[i].名字 === 名字) 将 = 将领池[i];
      if (!将 || 将.解锁功勋 === 0) return;
      if (已买升级们["将领·" + 名字]) return;
      if (功勋 < 将.解锁功勋) { 提示("功勋不够（还差 " + (将.解锁功勋 - 功勋) + "）"); return; }
      功勋 -= 将.解锁功勋;
      已买升级们["将领·" + 名字] = true;
      写存档();
      显示大厅();
    }

    function 形态钥匙(将领名, 形态名) { return "形态·" + 将领名 + "·" + 形态名; }

    function 战绩达标(形) {   // 形态二的第二道门：光有功勋不够，还得真的打到过那一城（第 33 步新增）
      if (!形.战绩) return true;
      return 总战绩.最远城 >= 形.战绩;
    }

    function 战绩文字(形) {
      if (!形.战绩) return "";
      return " · 需通关第 " + (形.战绩 - 1) + " 城";
    }

    function 形态已解锁(将领名, 形态名, 解锁功勋) {
      if (!解锁功勋) return true;   // 免费形态（每个将领的第一个形态）
      return !!已买升级们[形态钥匙(将领名, 形态名)];
    }

    function 解锁形态(将领名, 形态名) {
      let 目标 = null;
      for (let i = 0; i < 将领池.length; i++) {
        if (将领池[i].名字 !== 将领名) continue;
        if (将领池[i].解锁功勋 !== 0 && !已买升级们["将领·" + 将领名]) { 提示("先解锁这位诸侯"); return; }
        for (let j = 0; j < 将领池[i].形态.length; j++) if (将领池[i].形态[j].名 === 形态名) 目标 = 将领池[i].形态[j];
      }
      if (!目标 || !目标.解锁功勋) return;
      if (已买升级们[形态钥匙(将领名, 形态名)]) return;
      if (!战绩达标(目标)) {   // 形态二：需先打到过指定城池，光有功勋不行
        提示("战绩不够：需历史最远抵达第 " + 目标.战绩 + " 城（即通关第 " + (目标.战绩 - 1) + " 城）才能解锁「" + 目标.名 + "」");
        return;
      }
      if (功勋 < 目标.解锁功勋) { 提示("功勋不够（还差 " + (目标.解锁功勋 - 功勋) + "）"); return; }
      功勋 -= 目标.解锁功勋;
      已买升级们[形态钥匙(将领名, 形态名)] = true;
      写存档();
      显示大厅();
    }

    function 选择形态(将领名, 形态名) {
      let 目标 = null;
      for (let i = 0; i < 将领池.length; i++) {
        if (将领池[i].名字 !== 将领名) continue;
        if (将领池[i].解锁功勋 !== 0 && !已买升级们["将领·" + 将领名]) return;
        for (let j = 0; j < 将领池[i].形态.length; j++) {
          if (将领池[i].形态[j].名 !== 形态名) continue;
          if (!形态已解锁(将领名, 形态名, 将领池[i].形态[j].解锁功勋)) return;
          目标 = 将领池[i].形态[j];
        }
      }
      if (!目标) return;
      已选将领 = 将领名;
      已选形态 = 形态名;
      将领 = 取形态(将领名, 形态名);
      写存档();
      提示("下一局由 " + 将领名 + "·「" + 形态名 + "」出战：" + 目标.说明);
      显示大厅();
    }

    function 开始逐鹿() {
      隐藏所有遮罩();
      重新开始();
    }

    function 买升级(名字) {
      let 武 = null;
      for (let i = 0; i < 武将池.length; i++) if (武将池[i].名字 === 名字) 武 = 武将池[i];
      if (!武 || !武.解锁功勋) return;
      if (已买升级们[名字]) { 提示("已经解锁过了"); return; }
      if (功勋 < 武.解锁功勋) { 提示("功勋不够（还差 " + (武.解锁功勋 - 功勋) + "）"); return; }
      功勋 -= 武.解锁功勋;
      已买升级们[名字] = true;
      写存档();
      显示大厅();
    }

    function 首个形态名(将领名) {
      for (let i = 0; i < 将领池.length; i++) if (将领池[i].名字 === 将领名) return 将领池[i].形态[0].名;
      return "织席贩履";
    }

    function 读存档() {
      try {
        let 存 = JSON.parse(localStorage.getItem("zhuolu-存档"));
        if (存 && typeof 存.功勋 === "number") {
          功勋 = 存.功勋; 已买升级们 = 存.已买 || {};
          if (存.已选将领) {
            已选将领 = 存.已选将领;
            已选形态 = 存.已选形态 || 首个形态名(已选将领);
            将领 = 取形态(已选将领, 已选形态);
          }
          if (存.设置) {   // 设置：逐项读，缺项用默认值（老存档兼容）
            if (typeof 存.设置.演出开关 === "boolean") 设置.演出开关 = 存.设置.演出开关;
            if (存.设置.演出速度) 设置.演出速度 = 存.设置.演出速度;
          }
          if (存.统计) {   // 统计：逐项读，缺项用 0
            总战绩.局数 = 存.统计.局数 || 0;
            总战绩.一统次数 = 存.统计.一统次数 || 0;
            总战绩.最远城 = 存.统计.最远城 || 0;
            总战绩.最高战力 = 存.统计.最高战力 || 0;
            总战绩.累计破城 = 存.统计.累计破城 || 0;
          }
          新手礼包已领 = !!存.新手礼包已领;
        }
      } catch (e) { 功勋 = 0; 已买升级们 = {}; }
    }

    function 写存档() {
      localStorage.setItem("zhuolu-存档", JSON.stringify({
        功勋: 功勋, 已买: 已买升级们, 已选将领: 已选将领, 已选形态: 已选形态,
        设置: 设置, 统计: 总战绩, 新手礼包已领: 新手礼包已领
      }));
    }

    // —— 牌型表（页面底部对照）——

    function 画牌型表() {
      let 文字 = "<tr><th>牌型</th><th>基础兵力</th><th>士气</th></tr>";
      let 顺序 = ["皇家同花顺", "同花顺", "四条", "葫芦", "同花", "顺子", "三条", "两对", "一对", "高牌"];
      for (let i = 0; i < 顺序.length; i++) {
        let 项 = 牌型表[顺序[i]];
        文字 += "<tr><td>" + 顺序[i] + "</td><td>" + 项.兵力 + "</td><td>" + 项.士气 + "</td></tr>";
      }
      document.getElementById("牌型表").innerHTML = 文字;
    }

    读存档();
    画牌型表();
    应用设置();     // 把存档里的演出速度落到页面
    开卡牌货架();
    显示主菜单();   // 第 33 步：启动先停在主菜单，点「开始出征」才进第 1 城（不再一打开就掉进关卡）
  </script>
</body>
</html>
