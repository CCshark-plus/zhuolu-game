<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>三国·逐鹿 战力计算器（第一课）</title>
</head>
<body>
  <h1>三国·逐鹿 · 战力计算器</h1>
  <p>你的第一个程序：打开后会弹出一个框显示战力，按 F12 还能看到后台日志</p>

  <script>
    // ===== 第一课：变量、运算、函数 =====

    // 1. 变量（variable）：贴了标签的盒子，用来存数字
    let 兵力 = 200;   // 底数：打出的牌点数总和
    let 士气 = 7;     // 倍率：你身上的加成

    // 2. 运算：* 是乘号（电脑里不用 ×，怕和字母 x 混淆）
    let 战力 = 兵力 * 士气+50;

    // 3. alert：弹窗显示，让你立刻看到结果
    alert("这一手的战力是：" + 战力);

    // 4. console.log：把文字打到浏览器"控制台"（按 F12 查看）
    console.log("这一手的战力是：" + 战力);

    // 5. 函数（function）：把一段计算打包，起个名字，以后反复调用
    function 算战力(底数, 倍率) {
      return 底数 * 倍率;   // return = 把结果"交出来"
    }

    // 调用函数：把 120 和 4 塞进去
    console.log("用函数再算一次：" + 算战力(120, 4));
  </script>
</body>
</html>
